<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details | BookRecommender</title>
    <meta name="description" content="Detailed information and similar recommendations for your selected book. Powered by similarity indexes.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <div class="container header-content">
            <h1><a href="index.html">Book<span>Recommender</span></a></h1>
            <p>v1.0.0 // STITCH</p>
        </div>
    </header>

    <main class="container">
        <div class="back-button-container">
            <a href="index.html" class="back-button">
                <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 -960 960 960" width="18" fill="currentColor">
                    <path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/>
                </svg>
                Back to Index
            </a>
        </div>

        <div id="book-details">
            <!-- Details will be loaded dynamically -->
            <div class="loading-indicator">
                <div class="spinner"></div>
                <p>Retrieving volume specifications from index...</p>
            </div>
        </div>

        <section id="recommendations-section" class="recommendations-section">
            <h3 class="section-title">Recommended Matches</h3>
            <div id="recommendations-container" class="recommendations-container">
                <div class="loading-indicator">
                    <div class="spinner"></div>
                    <p>Generating similarity indices...</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 BookRecommender. Engineered with Google Stitch. All rights reserved.</p>
        </div>
    </footer>

    <script src="book.js"></script>
</body>

</html>
